name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
projects: ["Client Support"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **This repository is public.** Do not include passwords, keys, personal data or confidential business data.
        Cover sensitive data on screenshots. / **Repozitorijum je javan** — ne unosite lozinke ni poverljive podatke.

        After you submit, an automated AI analysis reviews the report and may ask follow-up questions in a comment.
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: extension
    attributes:
      label: What extentsion are you seeing the problem on?
      multiple: true
      options:
        - Localization features
        - Electronic Invoicing
        - HRM and Payroll
        - Electonic Invoicing and Localization Connector
        - Advanced Manufacturing COst Calculation
        - Travel Expenses
        - Serbian Language
        - HRM-Payroll and TravelExpenses Connector
        - Payment Discounts
        - Sales Price Inventory Value
      default: 0
  - type: input
    id: bc-version
    attributes:
      label: Business Central version
      description: "In Business Central: ? (Help) → Help & Support → Troubleshooting. Used to compare with standard BC code."
      placeholder: "ex. 29.1"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - SaaS (cloud)
        - OnPrem
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: "Extension Management page, Version column."
      placeholder: "ex. 29.0.12.0"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. The error message appears ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
 