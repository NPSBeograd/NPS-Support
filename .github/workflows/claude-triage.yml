# Automatska analiza prijava (issue-a) pomoću Claude-a.
#
# Tok (mode):
#   1. Klijent otvori issue          -> "initial" analiza (Sonnet)
#   2. Klijent odgovori na pitanja   -> "followup" analiza (Sonnet), samo dok issue ima labelu "waiting-for-customer"
#   3. Član tima doda labelu "claude-deep-analysis" -> "deep" analiza (Opus)
#
# Bezbednost (repo je javan, sadržaj issue-a je nepouzdan):
#   - Agent (Agent SDK) ima samo Read/Grep/Glob: nema Bash, mrežu ni GitHub token.
#     Prijavu i listu prijava mu unapred preuzima korak "Fetch issue" u fajlove (.triage/).
#   - Komentar i labele postavlja job "post" običnom skriptom, iz strukturisanog izlaza agenta.
#   - U ovom workflow-u nema drugih tajni osim ANTHROPIC_API_KEY (ključ sa niskim limitom potrošnje).

name: Claude issue triage

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

# Jedna analiza po issue-u u isto vreme, posebno za automatske i za dubinske analize.
# Događaji koji ne pokreću analizu (druge labele, komentari tima...) dobijaju sopstvenu grupu,
# da ne bi istisnuli analizu koja čeka u redu.
concurrency:
  group: >-
    claude-triage-${{ github.event.issue.number }}-${{
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-deep-analysis') && 'deep' ||
      ((github.event_name == 'issues' && github.event.action == 'opened') ||
       (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'waiting-for-customer') &&
        github.event.comment.user.login == github.event.issue.user.login)) && 'auto' ||
      github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  prep:
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && github.event.action == 'opened') ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-deep-analysis') ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
         contains(github.event.issue.labels.*.name, 'waiting-for-customer') &&
         github.event.comment.user.login == github.event.issue.user.login)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.prep.outputs.run }}
      mode: ${{ steps.prep.outputs.mode }}
      model: ${{ steps.prep.outputs.model }}
      max_turns: ${{ steps.prep.outputs.max_turns }}
      budget: ${{ steps.prep.outputs.budget }}
      bc_branch: ${{ steps.prep.outputs.bc_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/claude

      - name: Prepare (mode, model, BC version)
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_AUTO_RUNS: ${{ vars.CLAUDE_MAX_AUTO_RUNS || '3' }}
          BC_DEFAULT_MAJOR: ${{ vars.BC_DEFAULT_MAJOR || '29' }}
          CLAUDE_MODEL_AUTO: ${{ vars.CLAUDE_MODEL_AUTO || 'claude-sonnet-5-5' }}
          CLAUDE_MODEL_DEEP: ${{ vars.CLAUDE_MODEL_DEEP || 'claude-opus-5-5' }}
        run: bash .github/claude/prep.sh

  analyze:
    needs: prep
    if: needs.prep.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read   # samo za korak "Fetch issue"; agent nema token
    outputs:
      result: ${{ steps.claude.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Standard BC code (MSDyn365BC.Code.History)
        if: needs.prep.outputs.bc_branch != ''
        env:
          BC_BRANCH: ${{ needs.prep.outputs.bc_branch }}
        run: |
          git clone --depth 1 --single-branch -b "$BC_BRANCH" \
            https://github.com/StefanMaron/MSDyn365BC.Code.History bc-standard
          rm -rf bc-standard/.git

      # Prijava i lista prijava se preuzimaju ovde (bash, bez AI-ja), da agent ne bi imao GitHub token.
      - name: Fetch issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: bash .github/claude/fetch-issue.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Agent SDK
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/sdk" @anthropic-ai/claude-agent-sdk@0.3.319

      # Agent SDK, a ne claude-code-action: mesečni API kredit Team plana ne pokriva Claude Code.
      - name: Claude analysis
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ github.event.issue.number }}
          MODE: ${{ needs.prep.outputs.mode }}
          MODEL: ${{ needs.prep.outputs.model }}
          MAX_TURNS: ${{ needs.prep.outputs.max_turns }}
          BUDGET: ${{ needs.prep.outputs.budget }}
          BC_BRANCH: ${{ needs.prep.outputs.bc_branch }}
        run: |
          cp .github/claude/run-analysis.mjs "$RUNNER_TEMP/sdk/"
          node "$RUNNER_TEMP/sdk/run-analysis.mjs"

  post:
    needs: [prep, analyze]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/claude

      - name: Post comment and labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ needs.prep.outputs.run }}
          MODE: ${{ needs.prep.outputs.mode }}
          BC_BRANCH: ${{ needs.prep.outputs.bc_branch }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          RESULT: ${{ needs.analyze.outputs.result }}
        run: bash .github/claude/post.sh
