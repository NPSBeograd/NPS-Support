# Automatska analiza prijava (issue-a) pomoću Claude-a.
#
# Tok (mode):
#   1. Klijent otvori issue          -> "initial" analiza (Sonnet)
#   2. Klijent odgovori na pitanja   -> "followup" analiza (Sonnet), samo dok issue ima labelu "waiting-for-customer"
#   3. Član tima doda labelu "claude-deep-analysis" -> "deep" analiza (Opus)
#
# Bezbednost (repo je javan, sadržaj issue-a je nepouzdan):
#   - Agent radi u jobu "analyze" koji ima SAMO dozvole za čitanje i nema alate za pisanje.
#   - Komentar i labele postavlja job "post" običnom skriptom, iz strukturisanog izlaza agenta.
#   - U ovom workflow-u nema drugih tajni osim ANTHROPIC_API_KEY (ključ sa niskim limitom potrošnje).

name: Claude issue triage

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

# Jedna analiza po issue-u u isto vreme, posebno za automatske i za dubinske analize.
# Događaji koji ne pokreću analizu (druge labele, komentari tima...) dobijaju sopstvenu grupu,
# da ne bi istisnuli analizu koja čeka u redu.
concurrency:
  group: >-
    claude-triage-${{ github.event.issue.number }}-${{
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-deep-analysis') && 'deep' ||
      ((github.event_name == 'issues' && github.event.action == 'opened') ||
       (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'waiting-for-customer') &&
        github.event.comment.user.login == github.event.issue.user.login)) && 'auto' ||
      github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  prep:
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && github.event.action == 'opened') ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-deep-analysis') ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
         contains(github.event.issue.labels.*.name, 'waiting-for-customer') &&
         github.event.comment.user.login == github.event.issue.user.login)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.prep.outputs.run }}
      mode: ${{ steps.prep.outputs.mode }}
      model: ${{ steps.prep.outputs.model }}
      max_turns: ${{ steps.prep.outputs.max_turns }}
      budget: ${{ steps.prep.outputs.budget }}
      bc_branch: ${{ steps.prep.outputs.bc_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/claude

      - name: Prepare (mode, model, BC version)
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_AUTO_RUNS: ${{ vars.CLAUDE_MAX_AUTO_RUNS || '3' }}
          BC_DEFAULT_MAJOR: ${{ vars.BC_DEFAULT_MAJOR || '29' }}
          CLAUDE_MODEL_AUTO: ${{ vars.CLAUDE_MODEL_AUTO || 'claude-sonnet-5-5' }}
          CLAUDE_MODEL_DEEP: ${{ vars.CLAUDE_MODEL_DEEP || 'claude-opus-5-5' }}
        run: bash .github/claude/prep.sh

  analyze:
    needs: prep
    if: needs.prep.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Standard BC code (MSDyn365BC.Code.History)
        if: needs.prep.outputs.bc_branch != ''
        env:
          BC_BRANCH: ${{ needs.prep.outputs.bc_branch }}
        run: |
          git clone --depth 1 --single-branch -b "$BC_BRANCH" \
            https://github.com/StefanMaron/MSDyn365BC.Code.History bc-standard
          rm -rf bc-standard/.git

      - name: Prepare tools and output schema
        id: schema
        run: |
          chmod +x .github/claude/gh.sh
          echo "json=$(jq -c . .github/claude/triage-schema.json)" >> "$GITHUB_OUTPUT"

      - name: Claude analysis
        id: claude
        uses: anthropics/claude-code-action@v1   # posle testiranja zakucajte na commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_SCRIPT_CAPS: '{"gh.sh":20}'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          display_report: "false"   # tekst modela nikad u javni Step Summary
          prompt: "/nps-triage ISSUE=${{ github.event.issue.number }} MODE=${{ needs.prep.outputs.mode }} BC_BRANCH=${{ needs.prep.outputs.bc_branch }}"
          claude_args: |
            --model ${{ needs.prep.outputs.model }}
            --max-turns ${{ needs.prep.outputs.max_turns }}
            --max-budget-usd ${{ needs.prep.outputs.budget }}
            --allowedTools "Read,Grep,Glob,Bash(./.github/claude/gh.sh:*)"
            --disallowedTools "Write,Edit,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.schema.outputs.json }}'

      # Kada analiza padne bez ijednog odgovora modela (npr. neispravan API ključ, nema kredita),
      # action sakriva razlog. Ovaj korak ispisuje samo kratku poruku o grešci, bez teksta modela.
      - name: Show analysis error
        if: failure() && steps.claude.outcome == 'failure'
        run: |
          EXEC_FILE="$RUNNER_TEMP/claude-execution-output.json"
          if [[ ! -f "$EXEC_FILE" ]]; then
            echo "::error::Execution output not found."
            exit 0
          fi
          jq -r '
            (if type == "array" then . else [.] end)
            | map(select(.type == "result")) | last
            | if . == null then "No result message."
              elif (.is_error == true) and ((.total_cost_usd // 0) == 0)
                then "API error: \((.result // .subtype // "unknown")[:300])"
              else "Model ran (cost \(.total_cost_usd) USD) but returned no structured output (subtype: \(.subtype))."
              end' "$EXEC_FILE" \
            | sed -E 's/sk-ant-[A-Za-z0-9_-]+/[removed]/g' \
            | while IFS= read -r line; do echo "::error::$line"; done

  post:
    needs: [prep, analyze]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/claude

      - name: Post comment and labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ needs.prep.outputs.run }}
          MODE: ${{ needs.prep.outputs.mode }}
          BC_BRANCH: ${{ needs.prep.outputs.bc_branch }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          RESULT: ${{ needs.analyze.outputs.result }}
        run: bash .github/claude/post.sh
